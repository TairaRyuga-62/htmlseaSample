<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ディープ・レンジャー（試作）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#021018;color:#e6f7ff;font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:crosshair}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 4px #000c}
#mis{top:12px;left:14px;max-width:46vw;font-weight:600}
#mis small{display:block;font-weight:400;opacity:.85}
#dep{top:12px;right:14px;text-align:right;font-weight:700;font-size:20px}
#dep small{display:block;font-size:12px;font-weight:500}
#o2w{left:50%;bottom:18px;transform:translateX(-50%);width:min(420px,60vw)}
#o2l{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px}
#o2b{height:10px;border-radius:6px;background:#0008;box-shadow:0 0 0 1px #9fe8ff66;overflow:hidden}
#stl{font-size:11px;font-weight:700;margin:5px 0 2px;opacity:.85}
#stb{height:6px;border-radius:4px;background:#0008;overflow:hidden}
#stf{height:100%;width:100%;background:linear-gradient(90deg,#c8f560,#f4ff9a);transform-origin:0}
#o2w.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}
#o2f{height:100%;width:100%;background:linear-gradient(90deg,#33d6ff,#a8f4ff);transform-origin:0;transition:background .3s}
#caps{left:14px;bottom:14px;display:flex;gap:8px;pointer-events:auto}
.cap{width:62px;height:62px;border-radius:12px;background:#02202cc0;box-shadow:inset 0 0 0 2px #7fdfff55;display:grid;place-items:center;font-size:11px;text-align:center;line-height:1.2;cursor:pointer;position:relative}
.cap i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 3px}
.cap b{position:absolute;top:3px;left:6px;font-size:10px;opacity:.7}
.cap.empty{opacity:.35;cursor:default}
#msg{left:50%;top:22%;transform:translateX(-50%);font-size:22px;font-weight:800;text-align:center;transition:opacity .4s;opacity:0;white-space:nowrap}
#map{right:14px;top:70px;left:auto;bottom:auto;inset:auto;right:14px;top:70px;width:104px;height:251px;border-radius:10px;box-shadow:0 0 0 1px #7fdfff55;background:#0008}
#tip{left:14px;bottom:86px;max-width:300px;padding:8px 12px;border-radius:10px;background:#03202ce8;box-shadow:inset 0 0 0 1px #7fdfff77;font-size:13px;display:none}
#tip b{font-size:15px}
#hint{left:50%;bottom:52px;transform:translateX(-50%);font-size:14px;font-weight:700;color:#fff6c0;white-space:nowrap}
.cap.buoy{width:auto;padding:0 10px;background:#3a2a0cc0;box-shadow:inset 0 0 0 2px #ffcf7a77}
#help{right:14px;bottom:14px;font-size:12px;text-align:right;opacity:.85}
/* ---------- out-game (port) ---------- */
#base{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 70% -10%,#0d5a7a55,transparent 60%),linear-gradient(180deg,#03131dd0,#020c13f2 70%);display:flex;flex-direction:column}
#base.hide,#res.hide,.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:18px;padding:14px 26px 10px}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-size:28px;font-weight:900;letter-spacing:.06em;background:linear-gradient(#e9fdff,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px #1ec8ff55)}
.logo small{font-size:10px;letter-spacing:.42em;color:#5fb6cc;margin-top:4px}
.chap{display:flex;align-items:center;gap:8px;margin-left:10px;padding:6px 12px;border-radius:999px;background:#0a2b3cb0;box-shadow:inset 0 0 0 1px #2c6a8588;font-size:12px;color:#a9dceb}
.chap .dots{display:flex;gap:4px}.chap .dots i{width:9px;height:9px;border-radius:50%;background:#1d4a5e}.chap .dots i.on{background:#5ff0ff;box-shadow:0 0 6px #5ff0ff}.chap .dots i.now{background:#fff3a0;box-shadow:0 0 8px #fff3a0}
.spacer{flex:1}
.badge{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:linear-gradient(#2b2208,#1a1505);box-shadow:inset 0 0 0 1.5px #c99b3a,0 4px 14px #0007;font-weight:900;font-size:18px;color:#ffe9a8}
.badge.alt{background:linear-gradient(#0c2c3c,#071a24);box-shadow:inset 0 0 0 1.5px #3c8aa8,0 4px 14px #0007;color:#cdeff9;font-size:15px}
.badge small{font-size:11px;font-weight:600;opacity:.75}
.hub{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;padding:6px 26px 22px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.quest{position:relative;border-radius:16px;padding:16px 18px 16px;background:linear-gradient(160deg,#1b2a2e,#0e1b20);box-shadow:inset 0 0 0 1.5px #c99b3a99,0 10px 30px #0008}
.quest .tag{position:absolute;top:-10px;left:16px;padding:2px 10px;border-radius:6px;background:#c99b3a;color:#231803;font-size:11px;font-weight:900;letter-spacing:.15em}
.quest h2{margin:6px 0 6px;font-size:19px;line-height:1.35;color:#fff4d6}
.quest p{margin:0;font-size:13px;color:#c7d6d2;line-height:1.6}
.quest .rw{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border-radius:8px;background:#2b2208;color:#ffe9a8;font-weight:800;font-size:13px}
.divebox{border-radius:16px;padding:14px;background:#06283ad0;box-shadow:inset 0 0 0 1px #2c6a85,0 10px 30px #0008;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-radius:10px;background:#0a3449;padding:8px 6px;text-align:center}
.stat svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.stat b{display:block;font-size:16px}.stat small{font-size:10px;color:#8fc3d3}
#go{width:100%;border-radius:14px;padding:16px;font-size:22px;font-weight:900;letter-spacing:.2em;background:linear-gradient(#7ff6ff,#17a9d2);color:#022a38;box-shadow:0 0 0 2px #bff8ff66,0 6px 0 #0b5e78,0 12px 30px #1ec8ff55;transition:transform .1s}
#go:hover{filter:brightness(1.08);transform:translateY(-1px)}#go:active{transform:translateY(3px);box-shadow:0 0 0 2px #bff8ff66,0 3px 0 #0b5e78}
#go:disabled{background:#1d4a5e;color:#8fb8c6;box-shadow:none;letter-spacing:.05em;font-size:17px}
.gohint{text-align:center;font-size:11px;color:#6fa8b8;margin-top:-6px}
.tabs{display:flex;gap:4px}
.tab{padding:10px 18px 9px;border-radius:12px 12px 0 0;background:#04202dcc;color:#7fb4c4;font-weight:800;font-size:14px;box-shadow:inset 0 1px 0 #2c6a8566}
.tab.on{background:#06283a;color:#e8fbff;box-shadow:inset 0 2px 0 #5ff0ff}
.tab .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:#c94d4d;color:#fff;font-size:11px}
.pane{flex:1;min-height:0;overflow:auto;border-radius:0 16px 16px 16px;background:#06283a;box-shadow:inset 0 0 0 1px #2c6a85,0 10px 30px #0008;padding:16px 18px}
.sec{margin-bottom:16px}
.sec h4{margin:0 0 8px;font-size:13px;color:#8fe4ff;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.sec h4 span{font-weight:500;color:#6fa8b8}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:86px;height:96px;border-radius:14px;background:#0a3449;box-shadow:inset 0 0 0 1.5px #2c6a85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;cursor:pointer;position:relative;transition:transform .1s}
.slot:hover{transform:translateY(-2px)}
.slot svg{width:46px;height:46px}
.slot.empty{background:transparent;box-shadow:inset 0 0 0 1.5px #2c6a8566;border:0;color:#4f7f8f;cursor:default;font-weight:500}
.slot.empty:hover,.slot.lock:hover{transform:none}
.slot.lock{background:repeating-linear-gradient(45deg,#06202c,#06202c 6px,#082736 6px,#082736 12px);box-shadow:inset 0 0 0 1px #1d4a5e;color:#4f7f8f;cursor:default;font-size:10px;font-weight:500;text-align:center}
.slot.sel{box-shadow:inset 0 0 0 2.5px #5ff0ff,0 0 18px #5ff0ff55}
.slot .k{position:absolute;top:5px;left:8px;font-size:10px;color:#8fc3d3}
.detail{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:#0a3449;box-shadow:inset 0 0 0 1px #5ff0ff55}
.detail svg{width:64px;height:64px;flex:none}
.detail .tx{flex:1}.detail .tx b{font-size:16px}.detail .tx div{font-size:12px;color:#a9d3df}
.acts{display:flex;flex-direction:column;gap:6px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:800 13px system-ui,sans-serif;cursor:pointer;background:#1d5f7c;color:#eaffff;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.38;cursor:default;filter:none}
.btn.gold{background:linear-gradient(#e8b84a,#b07d1c);color:#2a1a00}
.btn.dim{background:#123d52}
.upgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.upg{border-radius:14px;background:#0a3449;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center}
.upg svg{width:44px;height:44px;grid-row:span 2}
.upg b{font-size:15px}
.pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:3px;background:#1d4a5e}.pips i.on{background:#5ff0ff;box-shadow:0 0 5px #5ff0ff88}
.upg .nx{grid-column:1/-1;font-size:12px;color:#a9d3df;display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.upg .nx em{font-style:normal;color:#7ff0c8;font-weight:800}
.upg .btn{grid-column:1/-1;margin-top:6px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dexc{border-radius:14px;background:#0a3449;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;position:relative}
.dexc svg{width:56px;height:56px}
.dexc b{font-size:13px}.dexc small{font-size:11px;color:#9cc9d8;line-height:1.4}
.dexc .cnt{position:absolute;top:6px;right:8px;font-size:11px;color:#8fc3d3;font-weight:800}
.dexc .dg{position:absolute;top:6px;left:8px;font-size:10px;font-weight:900;color:#ff8080}
.dexc.unk{opacity:.55}
.pearl{color:#ffe9a8;font-weight:800}
.inp{background:#0a2a3a;color:#fff;border:1px solid #2e6b80;border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:#06283a;border-radius:14px;padding:14px 16px;box-shadow:inset 0 0 0 1px #2c6a85}
.card h3{margin:0 0 8px;font-size:14px;color:#8fe4ff;letter-spacing:.08em}
button{border:0;border-radius:9px;padding:9px 14px;font:700 14px system-ui,sans-serif;cursor:pointer;background:#1d5f7c;color:#eaffff}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:default;filter:none}
.sp{display:flex;gap:10px;align-items:center;background:#0a3449;border-radius:10px;padding:8px 12px}
.sp i{width:26px;height:26px;border-radius:50%;flex:none}
.howto{font-size:13px;color:#b9dbe6;line-height:1.75}
.howto kbd{display:inline-block;min-width:18px;padding:0 6px;border-radius:5px;background:#0a3449;box-shadow:inset 0 -2px 0 #02141c,0 0 0 1px #2c6a85;font:700 12px system-ui;color:#e8fbff;text-align:center}
/* result */
#res{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#0b3a52aa,#020c13ee)}
.rpanel{width:min(620px,92vw);max-height:90vh;overflow:auto;border-radius:20px;background:#06283a;box-shadow:inset 0 0 0 1.5px #2c6a85,0 20px 60px #000a}
.rhead{padding:22px 24px 16px;text-align:center;border-radius:20px 20px 0 0;background:linear-gradient(#0d4560,#06283a)}
.rhead.win{background:linear-gradient(#5a4310,#06283a)}.rhead.fail{background:linear-gradient(#5a1620,#06283a)}
.rhead h2{margin:0;font-size:28px;font-weight:900;letter-spacing:.12em}
.rgold{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:30px;font-weight:900;color:#ffe9a8}
.rgold svg{width:30px;height:30px}
.rbody{padding:4px 24px 22px}
.rline{font-size:13px;color:#cfe7ee;padding:7px 0;border-bottom:1px solid #2c6a8544}
.pend{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-top:8px;border-radius:14px;background:#0a3449}
.pend svg{width:48px;height:48px;flex:none}
.pend .tx{flex:1;min-width:0}.pend .tx b{font-size:14px}.pend .tx div{font-size:11px;color:#9cc9d8}
.seg{display:flex;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #2c6a85}
.seg button{border-radius:0;padding:8px 10px;font-size:12px;background:#0d3a50;color:#a9d3df}
.seg button.on{background:#5ff0ff;color:#03303e}
.seg button.on.sell{background:#e8b84a;color:#2a1a00}
#rOk{width:100%;margin-top:16px;border-radius:12px;padding:13px;font-size:17px;font-weight:900;background:linear-gradient(#7ff6ff,#17a9d2);color:#022a38}
@media (max-width:820px){.hub{grid-template-columns:1fr;overflow:auto}.col{min-height:auto}.pane{min-height:420px}}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:20px;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div class="hud" id="mis"></div>
<div class="hud" id="dep"></div>
<div class="hud" id="o2w"><div id="o2l"><span>酸素</span><span id="o2t"></span></div><div id="o2b"><div id="o2f"></div></div><div id="stl"><span>スタミナ（Shiftでダッシュ）</span></div><div id="stb"><div id="stf"></div></div></div>
<div class="hud" id="caps"></div>
<div class="hud" id="msg"></div>
<canvas class="hud" id="map" width="240" height="580"></canvas>
<div class="hud" id="tip"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="help">WASD 泳ぐ · Shift 急ぐ · ドラッグ 光の輪 · 1〜5 能力 · 右クリック 逃がす · E 浮上 · R 緊急ブイ · F 仲間に酸素</div>
<div id="base">
  <div class="topbar">
    <div class="logo"><b>ディープ・レンジャー</b><small>DEEP RANGER</small></div>
    <div class="chap" id="bChap"></div>
    <div class="spacer"></div>
    <div class="badge alt" id="bBuoy"></div>
    <div class="badge" id="bGold"></div>
  </div>
  <div class="hub">
    <div class="col">
      <div class="quest" id="bQuest"></div>
      <div class="divebox">
        <div id="bCarry"></div>
        <div class="stats" id="bStats"></div>
        <button id="go">潜る</button>
        <div class="gohint" id="goHint">Enterキーでも出発</div>
      </div>
    </div>
    <div class="col">
      <div class="tabs" id="bTabs"></div>
      <div class="pane" id="bPane"></div>
    </div>
  </div>
  <div id="mpCard" class="hidden"><input id="mpName" class="inp" placeholder="なまえ" maxlength="8" style="width:130px"><button id="mpHost" class="btn">部屋を作る</button><input id="mpCode" class="inp" placeholder="コード" maxlength="4" style="width:90px;text-transform:uppercase"><button id="mpJoin" class="btn">参加する</button><div id="mpSt"></div><button id="reset" class="btn dim">記録を消す</button></div>
</div>
<div id="res" class="hide"><div class="rpanel"><div class="rhead" id="rHead"><h2 id="rT"></h2><div class="rgold" id="rG"></div></div><div class="rbody"><div id="rB"></div><button id="rOk">港にもどる</button></div></div></div>
<div id="err"></div>
<script>
(async () => {
"use strict";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const { sin, cos, sqrt, min, max, abs, floor, ceil, PI, pow, atan2, hypot, exp, round } = Math;
const TAU = PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => (x = clamp((x - a) / (b - a), 0, 1), x * x * (3 - 2 * x));
const norm = v => { const l = hypot(...v) || 1; return v.map(c => c / l) };
let seedS = 1;
const seed = s => { seedS = Math.imul(s, 7919) + 99991 | 0 };
const rand = () => { seedS = seedS + 0x6D2B79F5 | 0; let t = Math.imul(seedS ^ seedS >>> 15, 1 | seedS); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
const rb = (a, b) => a + (b - a) * rand();
const hash3 = (x, y, z) => { let r = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177) | 0; r = Math.imul(r ^ r >>> 13, 1274126177); return ((r ^ r >>> 16) >>> 0) / 4294967296 };
const noise3 = (x, y, z) => {
  const X = floor(x), Y = floor(y), Z = floor(z); let u = x - X, v = y - Y, w = z - Z;
  u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v); w = w * w * (3 - 2 * w);
  const a = lerp(lerp(hash3(X, Y, Z), hash3(X + 1, Y, Z), u), lerp(hash3(X, Y + 1, Z), hash3(X + 1, Y + 1, Z), u), v);
  const b = lerp(lerp(hash3(X, Y, Z + 1), hash3(X + 1, Y, Z + 1), u), lerp(hash3(X, Y + 1, Z + 1), hash3(X + 1, Y + 1, Z + 1), u), v);
  return lerp(a, b, w);
};
const fbm = (x, y, z, o = 3) => { let a = .5, s = 0; for (let i = 0; i < o; i++) { s += a * noise3(x, y, z); x = x * 2.03 + 17.1; y = y * 2.03 + 31.7; z = z * 2.03 + 5.3; a *= .5 } return s / (1 - 2 * a) };

// ================= world layout =================
// the dive goes along +Z: reef shallows → current gate → kelp forest → boulder gate → trench → wreck
const Z_GATE1 = [98, 118], Z_BOULDER = 247, Z_WRECK = 372, Z_CHEST = 226;
const pathX = z => 16 * sin(z * .012) + 7 * sin(z * .031 + 1);
const halfW = z => { let w = 40; w = lerp(w, 7.5, sstep(86, 98, z)); w = lerp(w, 29 + 5 * sin(z * .05), sstep(116, 128, z)); w = lerp(w, 5.5, sstep(230, 240, z)); w = lerp(w, 19 + 3 * sin(z * .07), sstep(254, 266, z)); w = lerp(w, 4.5, sstep(382, 392, z)); w = lerp(w, 44 + 6 * sin(z * .04), sstep(410, 432, z)); return w };
const COVES = [[-50, 50, 21, "西の入り江"], [48, 170, 18, "光る洞"], [-46, 202, 16, "カメの寝床"], [34, 322, 16, "深海の窪み"]].map(([dx, z, r, n]) => ({ x: pathX(z) + dx, z, r, name: n }));
const smin = (a, b, k) => { const h = max(k - abs(a - b), 0) / k; return min(a, b) - h * h * k * .25 };
const Z_ABYSS = 420, Z_BOSS = 500, BUOY_Z = 18;
const floorD = z => z < 92 ? lerp(10, 17, clamp(z / 92, 0, 1)) : z < 236 ? lerp(17, 30, (z - 92) / 144) : z < 388 ? lerp(30, 74, clamp((z - 236) / 140, 0, 1)) : z < Z_ABYSS ? lerp(74, 84, (z - 388) / 32) : lerp(84, 110, clamp((z - Z_ABYSS) / 70, 0, 1));
const heightAt = (x, z) => {
  let t = abs(x - pathX(z)) - halfW(z);
  for (const c of COVES) t = smin(t, hypot(x - c.x, z - c.z) - c.r, 9);
  t += (fbm(x * .04, 0, z * .04) - .5) * 9;
  let y = -floorD(z) + (fbm(x * .08, 1, z * .08) - .5) * 2.4 + .35 * sin(x * .7 + z * .25 + fbm(x * .2, 4, z * .2) * 3) * sstep(0, -5, t);
  y += 3.5 * max(0, fbm(x * .06, 3, z * .06) - .58) * 6 * sstep(-2, -10, t) * sstep(130, 90, z);
  y += lerp(24, 42, sstep(400, 430, z)) * sstep(0, 7, t) + 7 * fbm(x * .07, 2, z * .07) * sstep(2, 12, t);
  y += 34 * sstep(-6, -14, z) + 44 * sstep(548, 558, z);
  y -= 6 * exp(-(pow(x - pathX(Z_BOSS), 2) + pow(z - Z_BOSS, 2)) / 900);

      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> で泳ぐ（Wが深い方向）。<kbd>Shift</kbd> でダッシュ（スタミナを使う）。<br>
      生き物の近くで<b>ドラッグを始め、点線の輪に沿ってぐるっとなぞる</b>と捕獲ゲージが増え、100%で捕獲。<b>丸くきれいに、点線の近くを</b>なぞるほど一気に増えます。描いている間は時間がゆっくり流れます。<br>
      <span style="color:#ff8080">赤い生き物は危険</span>。触れると酸素が減り、なぞる線も切られます。<br>
      捕まえた生き物は <kbd>1</kbd>〜<kbd>5</kbd> で力を借りる（使うと海に帰る）。右クリックで逃がす。<br>
      酸素がなくなる前に、スタートの光るブイで <kbd>E</kbd> を押して浮上。<kbd>R</kbd> は緊急ブイ。戻れないと、カプセルの生き物と金貨の半分を失います。
    </div></div><div class="sec"><h4>記録</h4></div>`; const r = $("reset"); r.classList.remove("hidden"); P.lastChild.append(r) }

function slotEl(sp, i, where, sel) {
  const d = document.createElement("div"); d.className = "slot" + (sel ? " sel" : "");
  d.innerHTML = `<span class="k">${where === "carry" ? i + 1 : ""}</span>${icon(sp)}<span>${SPECIES[sp].name.replace(/（.*）/, "")}</span>`;
  d.onclick = () => { prepSel = sel ? null : { where, i }; renderBase() }; return d;
}
function renderPrep(P) {
  const capsMax = UPG.caps.val(save.up.caps), capsTop = UPG.caps.val(UPG.caps.costs.length);

  const r1 = sec("カプセル", `次の潜水に持って行く ${save.carry.length}/${capsMax}`);
  for (let i = 0; i < capsTop; i++) {
    if (i < save.carry.length) r1.append(slotEl(save.carry[i], i, "carry", prepSel && prepSel.where === "carry" && prepSel.i === i));
    else { const d = document.createElement("div"); d.className = i < capsMax ? "slot empty" : "slot lock"; d.innerHTML = i < capsMax ? "空き" : "強化で<br>解放"; r1.append(d) }
  }
  const r2 = sec("水槽", `港で保管 ${save.tank.length}/${TANK_MAX}`);
  for (let i = 0; i < TANK_MAX; i++) {
    if (i < save.tank.length) r2.append(slotEl(save.tank[i], i, "tank", prepSel && prepSel.where === "tank" && prepSel.i === i));
    else { const d = document.createElement("div"); d.className = "slot empty"; d.textContent = "空き"; r2.append(d) }
  }
  // selection detail
  const det = document.createElement("div"); det.className = "sec";
  if (prepSel) {
    const list = prepSel.where === "carry" ? save.carry : save.tank, sp = list[prepSel.i], S = SPECIES[sp];
    if (sp) {
      det.innerHTML = `<div class="detail">${icon(sp)}<div class="tx"><b>${S.name}</b>${S.danger ? ' <span style="color:#ff8080;font-size:11px;font-weight:900">危険</span>' : ""}<div>${S.ability}</div><div>効果範囲 ${S.range}m · 売値 <span class="pearl">${S.pearls}G</span></div></div><div class="acts"></div></div>`;
      const acts = det.querySelector(".acts");
      const mv = document.createElement("button"); mv.className = "btn"; mv.textContent = prepSel.where === "carry" ? "水槽にしまう" : "カプセルに入れる";
      mv.disabled = prepSel.where === "carry" ? save.tank.length >= TANK_MAX : save.carry.length >= capsMax;
      mv.onclick = () => { if (prepSel.where === "carry") save.tank.push(save.carry.splice(prepSel.i, 1)[0]); else save.carry.push(save.tank.splice(prepSel.i, 1)[0]); prepSel = null; persist(); sfx("pickup"); renderBase() };
      const sl = document.createElement("button"); sl.className = "btn gold"; sl.textContent = `売る +${S.pearls}G`;
      sl.onclick = () => { list.splice(prepSel.i, 1); save.pearls += S.pearls; prepSel = null; persist(); sfx("pickup"); renderBase() };
      acts.append(mv, sl);
    }
  } else det.innerHTML = `<div style="font-size:12px;color:#6fa8b8">生き物をクリックすると、能力の確認・入れ替え・売却ができます。</div>`;
  P.append(det);
  // items
  const it = sec("道具", "");
  const d = document.createElement("div"); d.className = "detail"; d.style.flex = "1";
  d.innerHTML = `${BUOYI.replace('width="24" height="24"', 'width="52" height="52"')}<div class="tx"><b>緊急ブイ</b> <span style="color:#8fc3d3">×${save.buoys || 0} / 3</span><div>潜っている途中に R で、その場からすぐ帰還できる（使い切り）</div></div>`;
  const b = document.createElement("button"); b.className = "btn gold"; b.textContent = "買う 20G"; b.disabled = save.pearls < 20 || (save.buoys || 0) >= 3; b.onclick = () => { save.pearls -= 20; save.buoys = (save.buoys || 0) + 1; persist(); sfx("pickup"); renderBase() };
  d.append(b); it.append(d);
}
function renderUpg(P) {
  P.innerHTML = `<div class="sec"><h4>強化 <span>ゴールドで装備を強くする</span></h4><div class="upgs" id="upgs"></div></div>`;
  for (const [k, u] of Object.entries(UPG)) {
    const lv = save.up[k], mx = u.costs.length, cost = u.costs[lv], d = document.createElement("div"); d.className = "upg";
    d.innerHTML = `${uicon(k)}<b>${u.name}</b><div class="pips">${Array.from({ length: mx + 1 }, (_, i) => `<i class="${i <= lv ? "on" : ""}"></i>`).join("")}</div>
      <div class="nx"><span>${u.fmt(u.val(lv))}</span>${lv < mx ? `<em>→ ${u.fmt(u.val(lv + 1)).replace(/^[^0-9]*/, "")}</em>` : "<em>最大</em>"}</div>`;
    const b = document.createElement("button"); b.className = "btn gold";
    b.textContent = lv >= mx ? "最大レベル" : save.pearls < cost ? `${cost}G（あと${cost - save.pearls}G）` : `強化する ${cost}G`;
    b.disabled = lv >= mx || save.pearls < cost; b.onclick = () => { save.pearls -= cost; save.up[k]++; persist(); sfx("capture"); renderBase() };
    d.append(b); P.querySelector("#upgs").append(d);
  }
}
function renderDex(P) {

  P.innerHTML = `<div class="sec"><h4>図鑑 <span>${got} / ${all} 種</span></h4><div class="dex">${Object.entries(SPECIES).map(([k, s]) => {
    const kn = save.aq[k] > 0;
    return `<div class="dexc ${kn ? "" : "unk"}">${s.danger ? '<span class="dg">危険</span>' : ""}<span class="cnt">×${save.aq[k]}</span>${icon(k, kn)}<b>${kn ? s.name.replace(/（.*）/, "") : "？？？"}</b><small>${kn ? s.ability : "まだ出会っていない"}</small><small style="color:#ffe9a8">手ごわさ ${"★".repeat(s.loops)}<span style="opacity:.25">${"★".repeat(max(0, 6 - s.loops))}</span> · ${s.pearls}G</small></div>` }).join("")}</div></div>`;
}
$("go").onclick = () => { if (NET.on && !NET.host && !NET.sea) return; audio(); newDive() };
addEventListener("keydown", e => { if (state === "base" && e.code === "Enter" && document.activeElement?.tagName !== "INPUT" && !$("go").disabled) $("go").click() });
$("reset").onclick = () => { if (confirmReset()) { save = defSave(); persist(); renderBase() } };
let resetArm = 0; function confirmReset() { if (Date.now() - resetArm < 3000) return true; resetArm = Date.now(); $("reset").textContent = "もう一度押すと消えます"; setTimeout(() => $("reset").textContent = "記録を消す", 3000); return false }

// ================= main loop =================
let time = 0, last = 0;
buildDeco(1);
diver.p = [pathX(30), floorAt(pathX(30), 30) + 4, 30]; camP = [diver.p[0], diver.p[1] + 10, diver.p[2] - 12];
function frame(t) {
  requestAnimationFrame(frame);
  const dt = min(.05, last ? (t - last) / 1000 : .016); last = t; time += dt;
  if (state === "dive") step(dt); else if (NET.world) worldOnly(dt);
  if (state === "base") { diver.p[2] = 30 + sin(time * .05) * 20; diver.p[0] = pathX(diver.p[2]); diver.p[1] = floorAt(diver.p[0], diver.p[2]) + 5 }
  render(dt); drawOverlay(dt); hud();
}
renderBase(); setHud(false);
window.__T = {
  NET, base: () => renderBase(), net: m => onMsg(m), rescue: () => tryRescue(), keyF: () => keyF(),
  get state() { return state }, get dive() { return dive }, diver, save: () => save, SPECIES, MISSIONS,
  start: () => newDive(),
  setPos: (x, z) => { diver.p = [x, floorAt(x, z) + 2.6, z]; camera(0) },
  run: (sec, k = {}) => { Object.assign(keys, k); const n = round(sec * 60); for (let i = 0; i < n; i++) { if (state === "dive") step(1 / 60); else if (NET.world) worldOnly(1 / 60); time += 1 / 60 } for (const kk in k) keys[kk] = false; camera(0) },
  loopAround: (i, wob = 0, rm = 1.1) => { const c = dive.creatures[i]; camera(0); const s = project(c.p); capT = c; capAcc = 0; capLast = null; capQ = 0; capRs = []; const R = guideR(c, s) * rm; for (let a = 0; a <= 34; a++) { const w = 1 + wob * sin(a / 32 * TAU * 3); trackLoop({ x: s.x + cos(a / 32 * TAU) * R * w, y: s.y + sin(a / 32 * TAU) * R * w }) } capT = null; return c.loops },
  drawState: (on, i) => { drawing = on; capT = on ? dive.creatures[i] : null; if (on) { const s = project(capT.p); const R = guideR(capT, s) * 1.1; trail = []; capLast = null; capAcc = 0; for (let a = 0; a <= 20; a++) { const p = { x: s.x + cos(a / 32 * TAU) * R, y: s.y + sin(a / 32 * TAU) * R, t: performance.now() }; trail.push(p); trackLoop(p) } } },
  overlay: () => drawOverlay(0), shark: i => dive.sharks[i], hover: sp => sp ? showTip(sp) : hideTip(),
  use: i => useCap(i), pend: () => pend, ok: () => $("rOk").click(), ascend: () => tryAscend(), give: sp => { dive.caps.push(sp); renderCaps() },
  grab: () => { render(0); return canvas.toDataURL("image/png") }, floorAt, pathX,
